<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeliverableQA Report</title>
<style>
  :root { color-scheme: light; }
  .viz-root {
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);

    --series-1: #2a78d6; /* consistency */
    --series-2: #eb6834; /* brand_format */
    --series-3: #1baf7a; /* language_tone */
    --series-4: #eda100; /* structure */

    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-serious:  #ec835a;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1: #1a1a19; --page-plane: #0d0d0d;
      --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
      --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --status-good: #0ca30c; --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #e66767;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1: #1a1a19; --page-plane: #0d0d0d;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --gridline: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --status-good: #0ca30c; --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #e66767;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page-plane);
    color: var(--text-primary);
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 14px; margin: 0 0 28px; }

  .theme-toggle {
    position: absolute; top: 24px; right: 24px;
    font-size: 13px; color: var(--text-secondary);
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .stat-tile {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px;
  }
  .stat-tile .label { font-size: 13px; color: var(--text-secondary); margin: 0 0 6px; }
  .stat-tile .value { font-size: 28px; font-weight: 600; margin: 0; font-variant-numeric: proportional-nums; }
  .stat-tile.pass .value { color: var(--status-good); }
  .stat-tile.fail .value { color: var(--status-critical); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
    padding: 20px; margin-bottom: 20px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; color: var(--text-primary); }

  .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 720px) { .charts-row, .kpi-row { grid-template-columns: 1fr; } }

  canvas { max-width: 100%; }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--gridline); vertical-align: top; }
  th { color: var(--text-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.02em; }
  td.severity { white-space: nowrap; }
  .sev-badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500;
  }
  .sev-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .sev-critical .sev-dot { background: var(--status-critical); }
  .sev-warning  .sev-dot { background: var(--status-warning); }
  .sev-suggestion .sev-dot { background: var(--text-muted); }
  .sev-critical { color: var(--status-critical); }
  .sev-warning  { color: #8a6200; }
  .sev-suggestion { color: var(--text-secondary); }
  :root[data-theme="dark"] .sev-warning { color: var(--status-warning); }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .sev-warning { color: var(--status-warning); }
  }

  .view-toggle { display: flex; gap: 8px; margin-bottom: 14px; }
  .view-toggle button {
    font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text-secondary); cursor: pointer;
  }
  .view-toggle button[aria-pressed="true"] { background: var(--page-plane); color: var(--text-primary); font-weight: 500; }

  .empty-state { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }
</style>
</head>
<body>
<div class="viz-root">
  <div class="wrap">
    <button class="theme-toggle" id="themeToggle" type="button">Dark mode</button>
    <h1>DeliverableQA Report</h1>
    <p class="subtitle" id="subtitle">Loading findings…</p>

    <div class="kpi-row" id="kpiRow"></div>

    <div class="charts-row">
      <div class="card">
        <h2>Findings by severity</h2>
        <canvas id="severityChart" height="220"></canvas>
      </div>
      <div class="card">
        <h2>Findings by agent</h2>
        <canvas id="agentChart" height="220"></canvas>
        <div class="legend" id="agentLegend"></div>
      </div>
    </div>

    <div class="card">
      <h2>Detailed findings</h2>
      <div class="view-toggle" role="group" aria-label="View mode">
        <button id="viewChartLike" aria-pressed="true" type="button">Grouped by section</button>
        <button id="viewTable" aria-pressed="false" type="button">Table view</button>
      </div>
      <div id="findingsBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script>
(function () {
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");
  function currentTheme() {
    return root.getAttribute("data-theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }
  themeToggle.textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode";
  themeToggle.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    themeToggle.textContent = next === "dark" ? "Light mode" : "Dark mode";
    renderCharts(window.__qaData);
  });

  function cssVar(name) {
    return getComputedStyle(document.querySelector(".viz-root")).getPropertyValue(name).trim();
  }

  const SEVERITY_COLOR = {
    critical: () => cssVar("--status-critical"),
    warning: () => cssVar("--status-warning"),
    suggestion: () => cssVar("--text-muted"),
  };
  const AGENT_COLOR = {
    consistency: () => cssVar("--series-1"),
    brand_format: () => cssVar("--series-2"),
    language_tone: () => cssVar("--series-3"),
    structure: () => cssVar("--series-4"),
  };
  const AGENT_LABEL = {
    consistency: "Consistency",
    brand_format: "Brand / Format",
    language_tone: "Language / Tone",
    structure: "Structure",
  };

  let severityChartInstance, agentChartInstance;

  function renderKpis(dashboard) {
    const kpiRow = document.getElementById("kpiRow");
    const passFail = dashboard.pass_fail === "fail" ? "fail" : "pass";
    kpiRow.innerHTML = `
      <div class="stat-tile ${passFail}">
        <p class="label">Recommendation</p>
        <p class="value">${passFail === "fail" ? "Fail" : "Pass"}</p>
      </div>
      <div class="stat-tile">
        <p class="label">Total findings</p>
        <p class="value">${dashboard.total_findings}</p>
      </div>
      <div class="stat-tile">
        <p class="label">Critical</p>
        <p class="value">${dashboard.counts_by_severity.critical || 0}</p>
      </div>
      <div class="stat-tile">
        <p class="label">Warnings</p>
        <p class="value">${dashboard.counts_by_severity.warning || 0}</p>
      </div>
    `;
  }

  function renderCharts(data) {
    const { dashboard } = data;
    const sevLabels = ["critical", "warning", "suggestion"];
    const sevData = sevLabels.map((s) => dashboard.counts_by_severity[s] || 0);
    const sevColors = sevLabels.map((s) => SEVERITY_COLOR[s]());

    if (severityChartInstance) severityChartInstance.destroy();
    severityChartInstance = new Chart(document.getElementById("severityChart"), {
      type: "bar",
      data: {
        labels: ["Critical", "Warning", "Suggestion"],
        datasets: [{
          data: sevData,
          backgroundColor: sevColors,
          borderRadius: 4,
          barThickness: 24,
        }],
      },
      options: {
        indexAxis: "y",
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.x} finding${ctx.parsed.x === 1 ? "" : "s"}` } },
        },
        scales: {
          x: { beginAtZero: true, ticks: { precision: 0, color: cssVar("--text-muted") }, grid: { color: cssVar("--gridline") } },
          y: { ticks: { color: cssVar("--text-secondary") }, grid: { display: false } },
        },
      },
    });

    const agentKeys = Object.keys(AGENT_LABEL).filter((k) => k in dashboard.counts_by_agent);
    const agentData = agentKeys.map((k) => dashboard.counts_by_agent[k] || 0);
    const agentColors = agentKeys.map((k) => AGENT_COLOR[k]());

    if (agentChartInstance) agentChartInstance.destroy();
    agentChartInstance = new Chart(document.getElementById("agentChart"), {
      type: "bar",
      data: {
        labels: agentKeys.map((k) => AGENT_LABEL[k]),
        datasets: [{
          data: agentData,
          backgroundColor: agentColors,
          borderRadius: 4,
          barThickness: 24,
        }],
      },
      options: {
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: (ctx) => `${ctx.parsed.y} finding${ctx.parsed.y === 1 ? "" : "s"}` } },
        },
        scales: {
          y: { beginAtZero: true, ticks: { precision: 0, color: cssVar("--text-muted") }, grid: { color: cssVar("--gridline") } },
          x: { ticks: { color: cssVar("--text-secondary") }, grid: { display: false } },
        },
      },
    });

    const legend = document.getElementById("agentLegend");
    legend.innerHTML = agentKeys
      .map((k) => `<span class="legend-item"><span class="swatch" style="background:${AGENT_COLOR[k]()}"></span>${AGENT_LABEL[k]}</span>`)
      .join("");
  }

  function severityBadge(sev) {
    return `<span class="sev-badge sev-${sev}"><span class="sev-dot"></span>${sev.charAt(0).toUpperCase() + sev.slice(1)}</span>`;
  }

  function renderGroupedView(detailedReport) {
    const container = document.getElementById("findingsBody");
    const sections = Object.entries(detailedReport.sections || {});
    if (sections.length === 0) {
      container.innerHTML = '<div class="empty-state">No findings — nothing to review.</div>';
      return;
    }
    container.innerHTML = sections
      .map(([section, findings]) => `
        <h3 style="font-size:13px;color:var(--text-secondary);margin:16px 0 8px;">${section}</h3>
        <table>
          <thead><tr><th>Severity</th><th>Category</th><th>Description</th><th>Proposed fix</th></tr></thead>
          <tbody>
            ${findings.map((f) => `
              <tr>
                <td class="severity">${severityBadge(f.severity)}</td>
                <td>${f.category}</td>
                <td>${f.description}</td>
                <td>${f.proposed_fix}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `)
      .join("");
  }

  function renderTableView(detailedReport) {
    const container = document.getElementById("findingsBody");
    const allFindings = Object.values(detailedReport.sections || {}).flat();
    if (allFindings.length === 0) {
      container.innerHTML = '<div class="empty-state">No findings — nothing to review.</div>';
      return;
    }
    container.innerHTML = `
      <table>
        <thead><tr><th>Severity</th><th>Section</th><th>Agent category</th><th>Evidence</th><th>Proposed fix</th></tr></thead>
        <tbody>
          ${allFindings.map((f) => `
            <tr>
              <td class="severity">${severityBadge(f.severity)}</td>
              <td>${f.location.section}</td>
              <td>${f.category}</td>
              <td>${f.evidence}</td>
              <td>${f.proposed_fix}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function wireViewToggle(detailedReport) {
    const btnGrouped = document.getElementById("viewChartLike");
    const btnTable = document.getElementById("viewTable");
    btnGrouped.addEventListener("click", () => {
      btnGrouped.setAttribute("aria-pressed", "true");
      btnTable.setAttribute("aria-pressed", "false");
      renderGroupedView(detailedReport);
    });
    btnTable.addEventListener("click", () => {
      btnGrouped.setAttribute("aria-pressed", "false");
      btnTable.setAttribute("aria-pressed", "true");
      renderTableView(detailedReport);
    });
  }

  async function load() {
    const subtitle = document.getElementById("subtitle");
    try {
      const res = await fetch("findings.json");
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      window.__qaData = data;
      subtitle.textContent = data.generated_at
        ? `Generated ${data.generated_at}`
        : "Merged findings across all specialist agents";
      renderKpis(data.dashboard);
      renderCharts(data);
      renderGroupedView(data.detailed_report);
      wireViewToggle(data.detailed_report);
    } catch (err) {
      subtitle.textContent = "Could not load findings.json — run run_qa.py first, or serve this folder with a local HTTP server.";
      console.error(err);
    }
  }

  load();
})();
</script>
</body>
</html>
