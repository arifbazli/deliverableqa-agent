<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DeliverableQA report</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // System font stack -- no remote webfont, no network round-trip, renders
  // instantly with whatever's already installed on the user's OS.
  tailwind.config = {
    theme: {
      extend: { fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', "Roboto", "Helvetica", "Arial", "sans-serif"] } },
    },
  };
</script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  /* Dark-mode-only design tokens -- single palette, no light-mode branch. */
  :root {
    --surface-2: #15171c;    /* page background */
    --surface-1: #1c1f26;    /* card/panel background */
    --fill-secondary: #22252c; /* inset/chip background */
    --border: #2c303a;
    --border-strong: #3a3f4b;
    --text-primary: #e8e9ec;
    --text-secondary: #d5d6db;
    --text-muted: #9aa0ab;   /* the spec's own AA-safe fallback -- see README/audit notes */
    --border-danger: #f87171;
    --fill-danger: #2a1c1c;
    --border-warning: #fbbf24;
    --fill-warning: #2a251a;
    --border-suggestion: #c7c9cf;
    --accent: #4c6ef5;
    --accent-hover: #3b5bdb;
    --success: #4ade80;
    --radius: 10px;
  }

  button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.001ms !important;
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body class="min-h-screen bg-[var(--surface-2)] text-[var(--text-primary)] antialiased">

  <header class="sticky top-0 z-10 border-b border-[var(--border)] bg-[var(--surface-2)]/90 backdrop-blur">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2 text-[15px] font-medium text-[var(--text-primary)]">
        <svg class="h-4 w-4 text-[var(--accent)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 13.5l1.8 1.8L15 11"/></svg>
        DeliverableQA
      </div>
      <div class="flex items-center gap-1.5">
        <button id="refreshButton" type="button" aria-label="Refresh" title="Refresh"
          class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-[var(--border)] bg-[var(--surface-1)] text-[var(--text-secondary)] transition hover:border-[var(--border-strong)] hover:text-[var(--text-primary)]">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/></svg>
        </button>
        <button id="clearButton" type="button" aria-label="Clear" title="Clear"
          class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-[var(--border)] bg-[var(--surface-1)] text-[var(--text-secondary)] transition hover:border-[var(--border-strong)] hover:text-[var(--text-primary)]">
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">

    <!-- Three-panel row: always visible, regardless of report state. -->
    <div class="mb-4 grid gap-3" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">

      <!-- Panel A: Upload -->
      <div class="flex flex-col gap-3 rounded-[var(--radius)] border border-[var(--border)] bg-[var(--surface-1)] p-4">
        <h2 class="text-[14px] font-medium text-[var(--text-primary)]">Upload</h2>
        <form id="uploadForm" class="flex flex-col gap-3">
          <label for="fileInput" class="flex cursor-pointer flex-col items-center justify-center gap-1 rounded-[8px] border border-dashed border-[var(--border-strong)] px-2 py-5 text-center transition hover:border-[var(--accent)]">
            <svg class="h-5 w-5 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 21h14"/></svg>
            <span id="fileInputLabel" class="text-[12px] text-[var(--text-muted)]">Drop file or browse</span>
            <input id="fileInput" type="file" accept=".docx,.pdf,.pptx" required class="sr-only" />
          </label>
          <select id="engagementSelect"
            class="block w-full rounded-md border border-[var(--border)] bg-[var(--fill-secondary)] px-3 py-2 text-[13px] text-[var(--text-secondary)]">
            <option value="advisory">Advisory</option>
            <option value="audit">Audit</option>
            <option value="tax">Tax</option>
            <option value="consulting">Consulting</option>
          </select>
        </form>
        <div id="fileChip" class="hidden items-center gap-2 rounded-md bg-[var(--fill-secondary)] px-2.5 py-2">
          <svg class="h-3.5 w-3.5 flex-shrink-0 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/></svg>
          <div class="min-w-0 flex-1">
            <p id="leftPanelFilename" class="truncate text-[12px] text-[var(--text-secondary)]"></p>
            <p id="leftPanelRefreshed" class="text-[11px] text-[var(--text-muted)]"></p>
          </div>
        </div>
        <div id="analyzeError" class="hidden rounded-md border border-[var(--border-danger)]/30 bg-[var(--fill-danger)] p-2.5 text-[13px] leading-normal text-[var(--border-danger)]"></div>
      </div>

      <!-- Panel B: Analyze -->
      <div class="flex flex-col gap-3 rounded-[var(--radius)] border border-[var(--border)] bg-[var(--surface-1)] p-4">
        <div class="flex items-center justify-between">
          <h2 class="text-[14px] font-medium text-[var(--text-primary)]">Analyze</h2>
          <span id="agentStatusText" class="text-[12px] text-[var(--text-muted)]"></span>
        </div>
        <div id="agentChecklist" class="flex flex-col gap-1.5"></div>
        <div id="analyzeStatus" class="hidden items-center gap-1.5 text-[12px] leading-normal text-[var(--text-muted)]">
          <svg class="h-3 w-3 flex-shrink-0 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
          <span id="analyzeStatusText">Analyzing&hellip; this calls Claude on Bedrock for real, so it can take a minute or two.</span>
        </div>
        <button id="analyzeButton" type="submit" form="uploadForm"
          class="mt-auto inline-flex items-center justify-center gap-1.5 rounded-md bg-[var(--accent)] px-4 py-2 text-[13px] font-medium text-white transition hover:bg-[var(--accent-hover)] disabled:cursor-not-allowed disabled:opacity-50">
          <span id="analyzeButtonLabel">Run analysis</span>
          <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </div>

      <!-- Panel C: Result -->
      <div class="flex flex-col gap-3 rounded-[var(--radius)] border border-[var(--border)] bg-[var(--surface-1)] p-4">
        <div class="flex items-center justify-between">
          <h2 class="text-[14px] font-medium text-[var(--text-primary)]">Result</h2>
          <span id="resultCount" class="text-[12px] text-[var(--text-muted)]"></span>
        </div>
        <div id="resultTiles" class="grid grid-cols-3 gap-2"></div>
      </div>

    </div>

    <!-- Findings list: loading / error / empty / content states. -->
    <div id="loadingState" class="flex items-center justify-center gap-2 rounded-[var(--radius)] border border-[var(--border)] bg-[var(--surface-1)] py-20 text-[15px] text-[var(--text-muted)]">
      <svg class="h-4 w-4 flex-shrink-0 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
      Loading report&hellip;
    </div>

    <div id="errorState" class="hidden rounded-[var(--radius)] border border-[var(--border-danger)]/30 bg-[var(--fill-danger)] p-6 text-[15px] leading-normal text-[var(--border-danger)]"></div>

    <div id="emptyState" class="hidden rounded-[var(--radius)] border border-[var(--border)] bg-[var(--surface-1)] p-10 text-center text-[15px] leading-normal text-[var(--text-muted)]">
      No findings yet — upload a document to begin.
    </div>

    <div id="findingsSection" class="hidden rounded-[var(--radius)] border border-[var(--border)] bg-[var(--surface-1)] p-4">
      <div class="mb-3 flex items-center justify-between gap-3">
        <h2 class="text-[14px] font-medium text-[var(--text-primary)]">All findings</h2>
        <div id="filterTabs" class="flex gap-1"></div>
      </div>
      <div id="findingsListScroll" class="flex flex-col overflow-y-auto" style="max-height: 280px;"></div>
    </div>

  </main>

<script>
(function () {
  const SEVERITY_LABEL = { critical: "Critical", warning: "Warning", suggestion: "Suggestion" };
  const SEVERITY_COLOR_VAR = { critical: "--border-danger", warning: "--border-warning", suggestion: "--border-suggestion" };
  const SEVERITY_FILL_VAR = { critical: "--fill-danger", warning: "--fill-warning", suggestion: "--fill-secondary" };
  const FILTERS = [["all", "All"], ["critical", "Critical"], ["warning", "Warning"], ["suggestion", "Suggestion"]];
  const AGENT_LIST = [
    { key: "consistency", label: "Consistency" },
    { key: "brand_format", label: "Brand and format" },
    { key: "language_tone", label: "Language and tone" },
    { key: "structure", label: "Structure and completeness" },
  ];

  // ---------- state ----------
  let activeFilter = "all"; // single-select: exactly one of FILTERS is active at a time
  let openRowId = null; // accordion: at most one finding row expanded at a time
  let lastDashboard = { counts_by_severity: {}, total_findings: 0 };
  let lastFindingsFlat = [];
  let agentStatus = "idle"; // "idle" | "running" | "done" -- see plan notes: the backend
  // has no per-agent progress signal (POST /api/analyze is one call that only resolves
  // once all 4 agents are done), so this is an honest tri-state, not simulated per-agent timing.

  function emptyState(message) {
    return `<div class="py-6 text-center text-[15px] leading-normal text-[var(--text-muted)]">${message}</div>`;
  }

  // ---------- Panel B: agent checklist ----------
  function agentIcon(isDone) {
    return isDone
      ? `<svg class="h-4 w-4 flex-shrink-0" style="color: var(--success);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 5-5"/></svg>`
      : `<svg class="h-4 w-4 flex-shrink-0 text-[var(--text-muted)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/></svg>`;
  }

  function setAgentStatus(status) {
    agentStatus = status;
    const label = status === "idle" ? `${AGENT_LIST.length} agents ready`
      : status === "running" ? `Running ${AGENT_LIST.length} agents`
      : `${AGENT_LIST.length} agents complete`;
    document.getElementById("agentStatusText").textContent = label;
    document.getElementById("analyzeButtonLabel").textContent = status === "done" ? "Re-run" : "Run analysis";
    const isDone = status === "done";
    document.getElementById("agentChecklist").innerHTML = AGENT_LIST
      .map((a) => `
        <div class="flex items-center gap-2 text-[13px]">
          ${agentIcon(isDone)}
          <span class="${isDone ? "text-[var(--text-primary)]" : "text-[var(--text-muted)]"}">${a.label}</span>
        </div>
      `)
      .join("");
  }

  // ---------- Panel C: result tiles ----------
  function resultTile(severity, label, count) {
    const isActive = activeFilter === severity;
    const colorVar = SEVERITY_COLOR_VAR[severity];
    const fillVar = SEVERITY_FILL_VAR[severity];
    return `
      <button type="button" data-tile-filter="${severity}"
        class="flex flex-col items-center gap-0.5 rounded-md border px-2 py-2.5 transition"
        style="border-color: ${isActive ? `var(${colorVar})` : "var(--border)"}; background: ${isActive ? `var(${fillVar})` : "transparent"};">
        <span class="text-[18px] font-medium" style="color: var(${colorVar});">${count}</span>
        <span class="text-[11px] text-[var(--text-muted)]">${label}</span>
      </button>
    `;
  }

  function renderResultTiles() {
    const counts = lastDashboard.counts_by_severity || {};
    const container = document.getElementById("resultTiles");
    container.innerHTML = [
      resultTile("critical", "Critical", counts.critical || 0),
      resultTile("warning", "Warning", counts.warning || 0),
      resultTile("suggestion", "Suggestion", counts.suggestion || 0),
    ].join("");
    container.querySelectorAll("[data-tile-filter]").forEach((btn) => {
      btn.addEventListener("click", () => setActiveFilter(btn.getAttribute("data-tile-filter")));
    });
    document.getElementById("resultCount").textContent = `${lastDashboard.total_findings || 0} findings`;
  }

  // ---------- findings list: filter tabs + accordion rows ----------
  function renderFilterTabs() {
    const container = document.getElementById("filterTabs");
    container.innerHTML = FILTERS
      .map(([key, label]) => {
        const isActive = activeFilter === key;
        return `
          <button type="button" data-filter-tab="${key}"
            class="rounded-full px-2.5 py-1 text-[12px] font-medium transition ${isActive ? "bg-[var(--accent)] text-white" : "bg-[var(--fill-secondary)] text-[var(--text-secondary)] hover:text-[var(--text-primary)]"}">
            ${label}
          </button>
        `;
      })
      .join("");
    container.querySelectorAll("[data-filter-tab]").forEach((btn) => {
      btn.addEventListener("click", () => setActiveFilter(btn.getAttribute("data-filter-tab")));
    });
  }

  function findingRow(f) {
    const colorVar = SEVERITY_COLOR_VAR[f.severity] || SEVERITY_COLOR_VAR.suggestion;
    const label = SEVERITY_LABEL[f.severity] || f.severity;
    const isOpen = openRowId === f.id;
    return `
      <div class="border-b border-[var(--border)] last:border-b-0">
        <button type="button" data-row-toggle="${f.id}" class="flex w-full items-center gap-2.5 py-2 text-left">
          <span class="h-2 w-2 flex-shrink-0 rounded-full" style="background: var(${colorVar});" title="${label}"></span>
          <span class="w-[130px] flex-shrink-0 truncate text-[12px] text-[var(--text-muted)]" title="${f.category}">${f.category}</span>
          <span class="min-w-0 flex-1 truncate text-[13px] text-[var(--text-secondary)]" title="${f.description}">${f.description}</span>
          <svg class="h-3.5 w-3.5 flex-shrink-0 text-[var(--text-muted)] transition-transform ${isOpen ? "rotate-90" : ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="${isOpen ? "" : "hidden"} flex flex-col gap-1 pb-3 pl-[18px] text-[13px] leading-normal">
          <!-- TODO: "Evidence" here is f.evidence -- what shows the finding is real, not
               why it happened. A true root-cause line would need a backend change (each
               specialist agent producing a short causal explanation, not just flagged
               evidence) -- not scoped/started, just marked for later. -->
          <p><span class="text-[var(--text-muted)]">Evidence</span> <span class="text-[var(--text-secondary)]">${f.evidence}</span></p>
          <p><span class="text-[var(--text-muted)]">Fix</span> <span class="text-[var(--text-secondary)]">${f.proposed_fix}</span></p>
        </div>
      </div>
    `;
  }

  function renderFindingsList() {
    const container = document.getElementById("findingsListScroll");
    const filtered = activeFilter === "all" ? lastFindingsFlat : lastFindingsFlat.filter((f) => f.severity === activeFilter);
    if (filtered.length === 0) {
      container.innerHTML = emptyState("No findings match the current filter.");
      return;
    }
    container.innerHTML = filtered.map(findingRow).join("");
    container.querySelectorAll("[data-row-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.getAttribute("data-row-toggle");
        openRowId = openRowId === id ? null : id;
        renderFindingsList();
      });
    });
  }

  function setActiveFilter(filter) {
    activeFilter = filter;
    openRowId = null;
    renderResultTiles();
    renderFilterTabs();
    renderFindingsList();
  }

  // ---------- top-level report render ----------
  function renderReport(data) {
    window.__qaData = data;
    lastDashboard = data.dashboard;
    lastFindingsFlat = Object.values(data.detailed_report.sections || {}).flat();
    activeFilter = "all";
    openRowId = null;

    const when = new Date().toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    const documentName = data.document_name || "";
    const filenameEl = document.getElementById("leftPanelFilename");
    filenameEl.textContent = documentName;
    filenameEl.title = documentName;
    document.getElementById("leftPanelRefreshed").textContent = `Refreshed ${when}`;
    document.getElementById("fileChip").classList.remove("hidden");
    document.getElementById("fileChip").classList.add("flex");

    renderResultTiles();
    renderFilterTabs();
    renderFindingsList();
    setAgentStatus("done");
  }

  function showState(name) {
    document.getElementById("loadingState").classList.toggle("hidden", name !== "loading");
    document.getElementById("errorState").classList.toggle("hidden", name !== "error");
    document.getElementById("emptyState").classList.toggle("hidden", name !== "empty");
    document.getElementById("findingsSection").classList.toggle("hidden", name !== "content");

    if (name === "empty") {
      window.__qaData = null;
      lastDashboard = { counts_by_severity: {}, total_findings: 0 };
      lastFindingsFlat = [];
      document.getElementById("fileChip").classList.add("hidden");
      document.getElementById("fileChip").classList.remove("flex");
      setAgentStatus("idle");
      renderResultTiles();
    }
  }

  async function loadFindings() {
    showState("loading");
    try {
      const res = await fetch("/api/findings", { cache: "no-store" });
      if (res.status === 404) {
        showState("empty");
        return;
      }
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        throw new Error((body && body.detail) || `Server returned HTTP ${res.status}`);
      }
      const data = await res.json();
      renderReport(data);
      showState("content");
    } catch (err) {
      document.getElementById("errorState").textContent =
        err instanceof TypeError
          ? "Couldn't reach the DeliverableQA server — is it running? (uv run server.py)"
          : err.message;
      showState("error");
    }
  }

  document.getElementById("refreshButton").addEventListener("click", loadFindings);

  document.getElementById("clearButton").addEventListener("click", async () => {
    try {
      await fetch("/api/findings", { method: "DELETE" });
    } catch (err) {
      // Best-effort -- loadFindings() below will surface any real connectivity problem.
    }
    window.__qaData = null;
    await loadFindings();
  });

  // ---------- upload / analyze ----------
  const uploadForm = document.getElementById("uploadForm");
  const fileInput = document.getElementById("fileInput");
  const fileInputLabel = document.getElementById("fileInputLabel");
  const engagementSelect = document.getElementById("engagementSelect");
  const analyzeButton = document.getElementById("analyzeButton");
  const analyzeStatus = document.getElementById("analyzeStatus");
  const analyzeStatusText = document.getElementById("analyzeStatusText");
  const analyzeError = document.getElementById("analyzeError");

  fileInput.addEventListener("change", () => {
    fileInputLabel.textContent = fileInput.files[0] ? fileInput.files[0].name : "Drop file or browse";
  });

  function setAnalyzing(isAnalyzing) {
    analyzeButton.disabled = isAnalyzing;
    fileInput.disabled = isAnalyzing;
    engagementSelect.disabled = isAnalyzing;
    analyzeStatus.classList.toggle("hidden", !isAnalyzing);
    analyzeStatus.classList.toggle("flex", isAnalyzing);
  }

  uploadForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!fileInput.files[0]) return;

    analyzeError.classList.add("hidden");
    analyzeStatusText.textContent = "Analyzing… this calls Claude on Bedrock for real, so it can take a minute or two.";
    setAnalyzing(true);
    setAgentStatus("running");

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("engagement_type", engagementSelect.value);

    try {
      const res = await fetch("/api/analyze", { method: "POST", body: formData });
      if (!res.ok) {
        const body = await res.json().catch(() => null);
        throw new Error((body && body.detail) || `Server returned HTTP ${res.status}`);
      }
      await loadFindings();
      uploadForm.reset();
      fileInputLabel.textContent = "Drop file or browse";
    } catch (err) {
      analyzeError.textContent =
        err instanceof TypeError
          ? "Couldn't reach the DeliverableQA server — is it running?"
          : err.message;
      analyzeError.classList.remove("hidden");
      setAgentStatus("idle");
    } finally {
      setAnalyzing(false);
    }
  });

  setAgentStatus("idle");
  renderResultTiles();
  loadFindings();
})();
</script>
</body>
</html>
