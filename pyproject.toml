[project]
name = "deliverableqa-agent"
version = "0.1.0"
description = "Multi-agent quality gate for consulting deliverables"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=0.2",
    "anthropic[bedrock]>=0.34",
    "boto3>=1.34",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false
